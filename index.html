<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cumulative Mark Difference Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 2rem;
    }
    canvas {
      background: #1e293b;
      border-radius: 1rem;
      box-shadow: 0 0 20px #0ea5e9;
      padding: 1rem;
    }
    h1 {
      color: #0ea5e9;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h1>Cumulative Mark Difference Chart</h1>
  <canvas id="markChart" width="900" height="400"></canvas>

  <script>
    // Correct order with REL included
    const subjects = ["Math", "B1", "B2", "REL", "Eng1", "Eng2", "ICT", "BGS", "Phy", "HM", "Che", "Bio"];

    // Marks in the order of subjects above
    const marks = {
      Medha: [83, 88, 80, 87, 82, 88, 49, 96, 75, 71, 80, 88],
      Raiyan: [89, 80, 83, 92, 86, 92, 49, 99, 90, 96, 84, 96],
      Sourav: [91, 76, 78, 85, 70, 88, 47, 97, 93, 92, 82, 95]
    };

    function calculateCumulativeDiff(data) {
      const diffData = { Medha: [], Raiyan: [], Sourav: [] };
      let total = { Medha: 0, Raiyan: 0, Sourav: 0 };

      for (let i = 0; i < subjects.length; i++) {
        total.Medha += data.Medha[i];
        total.Raiyan += data.Raiyan[i];
        total.Sourav += data.Sourav[i];

        // Find max cumulative total for this subject
        const maxScore = Math.max(total.Medha, total.Raiyan, total.Sourav);

        diffData.Medha.push(total.Medha - maxScore);
        diffData.Raiyan.push(total.Raiyan - maxScore);
        diffData.Sourav.push(total.Sourav - maxScore);
      }

      return diffData;
    }

    const diffData = calculateCumulativeDiff(marks);

    const ctx = document.getElementById('markChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: subjects,
        datasets: [
          {
            label: 'Medha',
            data: diffData.Medha,
            borderColor: '#f97316', // orange
            backgroundColor: 'transparent',
            tension: 0.4,
            pointRadius: 5,
            pointHoverRadius: 7,
          },
          {
            label: 'Raiyan',
            data: diffData.Raiyan,
            borderColor: '#0ea5e9', // sky blue
            backgroundColor: 'transparent',
            tension: 0.4,
            pointRadius: 5,
            pointHoverRadius: 7,
          },
          {
            label: 'Sourav',
            data: diffData.Sourav,
            borderColor: '#10b981', // green
            backgroundColor: 'transparent',
            tension: 0.4,
            pointRadius: 5,
            pointHoverRadius: 7,
          }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          tooltip: {
            callbacks: {
              label: function(context) {
                const val = context.raw;
                return `${context.dataset.label}: ${val === 0 ? 'Topper' : val}`;
              }
            }
          },
          legend: {
            labels: {
              color: 'white',
              font: { weight: 'bold', size: 14 }
            }
          }
        },
        scales: {
          y: {
            ticks: {
              color: 'white',
              stepSize: 5,
              callback: function(value) { return value === 0 ? 'Topper' : value; }
            },
            title: {
              display: true,
              text: 'Mark Difference (from Topper)',
              color: 'white',
              font: { size: 16, weight: 'bold' }
            },
            grid: {
              color: '#334155'
            }
          },
          x: {
            ticks: {
              color: 'white',
              font: { weight: 'bold' }
            },
            grid: {
              color: '#334155'
            }
          }
        }
      }
    });
  </script>
</body>
</html>
